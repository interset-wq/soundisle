name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keep CI on the same Flutter release the project is developed against.
  FLUTTER_VERSION: "3.47.9"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_BUILD: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$RELEASE_BUILD" = "true" ]; then
              echo "::error::Missing ANDROID_KEYSTORE_BASE64. Configure the four signing secrets before publishing."
              exit 1
            fi
            echo "::warning::Signing secrets not configured; main-branch build uses the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/soundisle-release.jks"
          cat > app/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/soundisle-release.jks
          EOF

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build embedded Go core
        run: |
          gomobile init
          ./scripts/build_mobile_core.sh android

      - name: Flutter analyze and test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # Ship arm64-v8a only: it covers essentially every modern Android phone
      # and keeps the APK/AAR small. Emulators and 32-bit devices are unsupported.
      - name: Build APK
        working-directory: app
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk \
             "$GITHUB_WORKSPACE/soundisle-android.apk"

      - name: Verify APK signature
        run: |
          APKSIGNER="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs soundisle-android.apk | tee apk-certs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: soundisle-android-apk
          path: soundisle-android.apk
          if-no-files-found: error

      - name: Publish prerelease
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^version: *//p' app/pubspec.yaml | cut -d+ -f1)"
          TAG="v${VERSION}-android.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" soundisle-android.apk apk-certs.txt \
            --title "声屿 Soundisle $TAG" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --notes "Android 验收包（预发布）

          - 版本：$VERSION（构建号 ${{ github.run_number }}）
          - 提交：${{ github.sha }}
          - 内置 Go 音乐核心（arm64-v8a）
          - 单包通用 APK，仅支持 arm64 真机，不含模拟器与 32 位支持
          - release 变体，使用稳定签名，可直接覆盖升级

          ## 安装

          \`\`\`bash
          adb install -r soundisle-android.apk
          \`\`\`

          从 1.0.1 升级因签名更换，需要先卸载旧版；从本版开始后续版本可直接覆盖安装。
          "

      - name: Upload release APK to summary
        if: success()
        run: |
          echo "### Android APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: \`soundisle-android.apk\`" >> "$GITHUB_STEP_SUMMARY"
