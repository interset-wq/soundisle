name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keep CI on the same Flutter release the project is developed against.
  FLUTTER_VERSION: "3.47.9"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build embedded Go core
        run: |
          gomobile init
          ./scripts/build_mobile_core.sh android

      - name: Flutter analyze and test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # The Go core ships arm64 + arm only, so skip the x86_64 engine and keep
      # a single universal APK for phones.
      - name: Build APK
        working-directory: app
        run: |
          flutter build apk --release --target-platform android-arm64,android-arm
          cp build/app/outputs/flutter-apk/app-release.apk \
             "$GITHUB_WORKSPACE/soundisle-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: soundisle-android-apk
          path: soundisle-android.apk
          if-no-files-found: error

      - name: Publish prerelease
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^version: *//p' app/pubspec.yaml | cut -d+ -f1)"
          TAG="v${VERSION}-android.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" soundisle-android.apk \
            --title "声屿 Soundisle $TAG" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --notes "Android 验收包（预发布）

          - 版本：$VERSION（构建号 ${{ github.run_number }}）
          - 提交：${{ github.sha }}
          - 内置 Go 音乐核心（arm64 / armeabi-v7a）
          - 单包通用 APK，不含 x86_64 模拟器支持
          - release 变体，使用 debug 签名，仅用于验收，请勿上架

          ## 安装

          \`\`\`bash
          adb install -r soundisle-android.apk
          \`\`\`

          也可以在手机上直接下载本页 APK 安装（需允许安装未知来源应用）。
          "

      - name: Upload release APK to summary
        if: success()
        run: |
          echo "### Android APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: \`soundisle-android.apk\`" >> "$GITHUB_STEP_SUMMARY"
